name: Publish HACS Release

on:
  workflow_dispatch:
  push:
    branches:
      - Release
    paths:
      - custom_components/ict_protege_enhanced/manifest.json
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish release from manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep the initial JC-fork baseline tagged for existing HACS installs.
          if ! gh release view v1.8.0 >/dev/null 2>&1; then
            gh release create v1.8.0 \
              --target 5b61e772a58802e4cb71cfc3c3a0914b62f2edd6 \
              --title "v1.8.0" \
              --notes "JC fork baseline release: timed door unlock, combined door state, dynamic door icons, and database ID 0 scanning."
          fi

          VERSION=$(python3 - <<'PY'
          import json
          with open('custom_components/ict_protege_enhanced/manifest.json', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
